name: Generate Snake

on:
  # Tự động chạy mỗi 24 giờ (vào lúc 00:00 UTC)
  schedule:
    - cron: "0 0 * * *" 
  
  # Cho phép bạn bấm chạy thủ công bằng tay bất cứ lúc nào
  workflow_dispatch:
  
  # Tự động chạy mỗi khi bạn push code lên branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Tạo ra các file game rắn từ đồ thị đóng góp của bạn
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: thanphuuuuu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Đẩy các file ảnh đã tạo lên một nhánh ẩn mang tên `output` để lưu trữ
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
